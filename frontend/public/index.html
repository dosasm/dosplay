<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOSASM</title>
</head>

<body>

    <div class="left-column">
        <div id="controls">
          <a href="https://dosasm.github.io/docs/tutorial-playGround/playGround">Dosplay</a>
          <select id="jsdosbundle">
            <option value="TASM">TASM</option>
            <option value="MASM-v5.00">MASM-v5.00</option>
            <option value="MASM-v6.11">MASM-v6.11</option>
            <option value="TurboC" selected>TurboC</option>
            <option value="helloworld">helloworld</option>
            <option value="dhry2">dhry2</option>
            <option value="mousetst">mousetst</option>
          </select>
          <select id="emulators">
            <option value="dosboxWorker">dosboxWorker</option>
            <option value="dosboxDirect">dosboxDirect</option>
            <option value="xWorker">xWorker</option>
            <option value="xDirect">xDirect</option>
            <option value="remoteDosboxDirect">remoteDosboxDirect</option>
          </select>
          <button id="start">start</button>
          <button id="stop">stop</button>
          <button id="editor-download-bundle">bundle</button>
        </div>

      <div>
        Frame:
        <br>
        <!-- <div class="jsdos-canvas-layout"> -->
          <canvas id="jsdos-canvas"></canvas>
        <!-- </div> -->
      </div>
      <p id="stats">Stats</p>
    </div>

    <div class="right-column">
      <button id="editor-reset" hidden>reset</button>
      <label for="editor-path">path:</label>
      <input id="editor-path" type="text">
      <button id="editor-write">write</button>
      <button id="editor-download-file">download this file</button>
      
      <br>
      <div id="editor">editor to edit file</div>
      <div id="terminal"></div>
    </div> 

</body>

</html>
